<text x="900" y="719" text-anchor="middle" font-size="16" font-weight="bold" fill="#72243E">Privacy by layer: bronze raw (restricted) → silver minimum necessary: name, DOB, sex, ZIP → gold pseudonymised: no direct identifiers</text>
<text x="900" y="742" text-anchor="middle" font-size="14" fill="#993556">SSN, street address, phone, licence and passport never leave bronze · 88 of 88 patients linked, 0 false matches · 1,799 visits linked one-to-one</text>
<rect x="40" y="780" width="1720" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="900" y="809" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">Notebooks: setup → bronze HL7 + FHIR → silver HL7 + FHIR → patient matching → gold star schema → views and dashboard</text>
<text x="900" y="832" text-anchor="middle" font-size="14" fill="#5F5E5A">Incremental landing → processed file handling · idempotent rebuilds · validation queries with expected values at every step</text>
